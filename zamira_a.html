<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para Zamira 🌼</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Georgia,'Times New Roman',serif}
body{background:radial-gradient(circle at 50% 88%,#204b38 0,#111d31 48%,#050813 100%);color:#fff}
.layer{position:absolute;inset:0;pointer-events:none}#sky{z-index:1}#decor{z-index:2}#plants{z-index:6}#petals{z-index:8}#fx{z-index:9}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 1.5s infinite alternate}
@keyframes tw{to{opacity:.15;transform:scale(.35)}}
.box{position:absolute;z-index:15;left:50%;top:36%;transform:translate(-50%,-50%);width:min(88%,860px);text-align:center;text-shadow:0 3px 16px #000}
h1{margin:0 0 14px;font-size:clamp(44px,8vw,80px);color:#ffe66e}
#phrase{font-size:clamp(20px,3.1vw,33px);line-height:1.42;min-height:125px;opacity:0;transform:translateY(12px);transition:.8s}
#phrase.show{opacity:1;transform:none}
button{border:0;border-radius:30px;padding:15px 28px;font-size:18px;background:#ffe460;color:#26321c;box-shadow:0 6px 22px #0009;cursor:pointer}

.plant{position:absolute;bottom:0;width:68px;transform:translateX(-50%);transform-origin:50% 100%;animation:sway 3.0s ease-in-out infinite}
.plant:nth-child(3n){animation-duration:3.7s} .plant:nth-child(4n){animation-duration:2.5s}
@keyframes sway{0%{transform:translateX(-50%) rotate(-5deg)}35%{transform:translateX(-50%) rotate(3.5deg)}70%{transform:translateX(-50%) rotate(-3deg)}100%{transform:translateX(-50%) rotate(5deg)}}
.stem{position:absolute;left:32px;bottom:0;width:4px;background:linear-gradient(#78ca5f,#2c7c3b);border-radius:5px;transform-origin:bottom;transform:scaleY(0);transition:transform .9s ease-out}
.leaf{position:absolute;width:28px;height:14px;background:linear-gradient(135deg,#79cf60,#2e7a3c);border-radius:100% 0 100% 0;opacity:0;transition:opacity .45s ease .55s}
.leaf1{left:5px;bottom:35%;transform:rotate(-25deg)} .leaf2{right:2px;bottom:56%;transform:scaleX(-1) rotate(-25deg)}
.flower{position:absolute;left:34px;top:-18px;width:0;height:0;opacity:0;transform:scale(.18) rotate(-3deg);transition:all .65s cubic-bezier(.2,.9,.2,1.35) 1.0s}
.fp{position:absolute;left:-7px;top:-31px;width:14px;height:31px;background:linear-gradient(#fff176,#ffd63b);transform-origin:7px 31px;border-radius:75% 75% 55% 55%;box-shadow:0 1px 2px #0003}
.fc{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:#8a571c;box-shadow:0 0 9px #ffd43b}
.flower.sunburst .fp{height:34px;top:-34px;width:11px;left:-5.5px;transform-origin:5.5px 34px}
.flower.layered .fp:nth-child(even){height:25px;top:-25px;filter:brightness(1.12)}
.flower.rounded .fp{border-radius:90% 90% 70% 70%;width:16px;left:-8px}
.flower.pointed .fp{clip-path:polygon(50% 0,100% 60%,50% 100%,0 60%);border-radius:35%}
.flower.soft .fp{border-radius:100% 60% 100% 60%;width:15px}
.plant.grow .stem{transform:scaleY(1)} .plant.grow .leaf{opacity:1} .plant.grow .flower{opacity:1;transform:scale(1) rotate(0)}

.fallpetal{position:absolute;color:#fff176;font-size:22px;animation:fall 6s linear forwards}
@keyframes fall{to{transform:translate(110px,110vh) rotate(620deg);opacity:0}}
.meteor,.comet{position:absolute;width:170px;height:2px;background:linear-gradient(90deg,#fff,transparent);filter:drop-shadow(0 0 6px #fff);animation:shoot 1.5s linear forwards}
.comet{height:3px;background:linear-gradient(90deg,#9ce7ff,#fff,transparent);filter:drop-shadow(0 0 8px #8ad7ff)}
@keyframes shoot{from{transform:translate(-20vw,-10vh) rotate(-28deg)}to{transform:translate(125vw,70vh) rotate(-28deg);opacity:0}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;animation:pop 1.35s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy));opacity:0}}

.moon{position:absolute;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbd2,#ffe89e 55%,#e7c15a 100%);box-shadow:0 0 35px #ffe9a6aa;top:8%;left:7%}
.cloud{position:absolute;width:180px;height:50px;background:#ffffff13;border-radius:50px;filter:blur(2px);animation:cloudMove 18s linear infinite}
@keyframes cloudMove{from{transform:translateX(-220px)}to{transform:translateX(115vw)}}
.lantern{position:absolute;width:18px;height:28px;border-radius:8px;background:radial-gradient(circle,#fff8b5,#ffd84a 55%,#ff9d00 100%);box-shadow:0 0 20px #ffd95f;animation:floatLantern 6s ease-in-out infinite}
@keyframes floatLantern{50%{transform:translateY(-18px)}}
.butterfly{position:absolute;font-size:18px;color:#ffd94b;animation:butterfly 9s linear infinite}
@keyframes butterfly{0%{transform:translate(-10vw,10vh) rotate(0)}50%{transform:translate(50vw,-8vh) rotate(12deg)}100%{transform:translate(110vw,8vh) rotate(-8deg)}}

</style></head>
<body>
<div id="sky" class="layer"></div><div id="decor" class="layer"></div><div id="plants" class="layer"></div><div id="petals" class="layer"></div><div id="fx" class="layer"></div>
<div class="box"><h1>Zamira 🌼</h1><div id="phrase">Tengo un pequeño detalle para vos.</div><button id="start">Tocá para comenzar</button></div>
<audio id="music" src="musica_flores.mp3" loop preload="auto"></audio>
<script>
const C={"slug": "zamira_a", "name": "Zamira", "theme": "lantern_glow", "phrases": ["Un pequeño detalle para agradecerte la buena predisposición de siempre.", "Gracias por acompañar mis clases con respeto y buena onda.", "Seguí disfrutando cada momento de esta etapa tan linda.", "Que la primavera que se acerca esté llena de buenos momentos para vos. 🌼", "¡Feliz Semana del Estudiante, Zamira! 🌼"], "moon": false, "butterflies": false, "lanterns": true, "clouds": false, "meteor_rate": 2, "fire_rate": 2, "flower": "layered", "palette": ["#fff176", "#ffd63b", "#ffbf26"]};
const sky=document.querySelector('#sky'),decor=document.querySelector('#decor'),plants=document.querySelector('#plants'),petals=document.querySelector('#petals'),fx=document.querySelector('#fx'),phrase=document.querySelector('#phrase'),music=document.querySelector('#music');
const fireCols=['#8ad7ff','#ff9fd2','#c7a0ff','#ffffff','#72f1b8','#ffd84d','#ff8fab'];

for(let i=0;i<145;i++){const s=document.createElement('i');s.className='star';const z=1+Math.random()*3;s.style.width=z+'px';s.style.height=z+'px';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*78+'%';s.style.animationDelay=Math.random()*2+'s';sky.appendChild(s)}

if(C.moon){let m=document.createElement('i');m.className='moon';decor.appendChild(m)}
if(C.clouds){for(let i=0;i<4;i++){let c=document.createElement('i');c.className='cloud';c.style.top=(10+i*11)+'%';c.style.animationDelay=(-i*4)+'s';decor.appendChild(c)}}
if(C.lanterns){for(let i=0;i<8;i++){let l=document.createElement('i');l.className='lantern';l.style.left=(8+i*12)+'%';l.style.top=(12+(i%3)*8)+'%';l.style.animationDelay=(i*.45)+'s';decor.appendChild(l)}}
if(C.butterflies){for(let i=0;i<7;i++){let b=document.createElement('i');b.className='butterfly';b.textContent='✦';b.style.top=(18+(i%4)*10)+'%';b.style.animationDelay=(-i*1.2)+'s';decor.appendChild(b)}}

function makePlant(i){
  const slots=31; const x=2.5 + (i%slots)*(95/30);
  // alternating long-short-long-short, with extra variation
  let h=(i%2===0?150:92)+(i%5)*8+Math.random()*16;
  if(C.theme==='golden_field') h=(i%2===0?155:95)+(i%7)*8+Math.random()*14;
  const wrap=document.createElement('div'); wrap.className='plant'; wrap.style.left=x+'%'; wrap.style.height=h+'px';
  const stem=document.createElement('div'); stem.className='stem'; stem.style.height=h+'px';
  const l1=document.createElement('div');l1.className='leaf leaf1'; const l2=document.createElement('div');l2.className='leaf leaf2';
  const fl=document.createElement('div');fl.className='flower '+C.flower;
  const pc=C.flower==='layered'?16:(C.flower==='sunburst'?14:12);
  for(let k=0;k<pc;k++){let p=document.createElement('i');p.className='fp';p.style.transform=`rotate(${k*360/pc}deg)`;fl.appendChild(p)}
  const center=document.createElement('i');center.className='fc';fl.appendChild(center);
  wrap.append(stem,l1,l2,fl);plants.appendChild(wrap);requestAnimationFrame(()=>wrap.classList.add('grow'));
}

function fillField(n=24){
  const start=plants.children.length;
  for(let j=0;j<n;j++) setTimeout(()=>makePlant(start+j),j*85);
}

function meteor(kind=0){
  const m=document.createElement('i');m.className=kind%2?'comet':'meteor';m.style.top=(5+Math.random()*34)+'%';m.style.left='-20%';sky.appendChild(m);setTimeout(()=>m.remove(),1800)
}

function petalRain(n=18){
  for(let i=0;i<n;i++)setTimeout(()=>{let p=document.createElement('i');p.className='fallpetal';p.textContent=i%3?'❋':'✦';p.style.left=Math.random()*100+'%';p.style.top='-6%';p.style.animationDuration=(4+Math.random()*3.5)+'s';petals.appendChild(p);setTimeout(()=>p.remove(),8000)},i*65)
}

function fireworks(bursts=3){
 for(let b=0;b<bursts;b++)setTimeout(()=>{let cx=12+Math.random()*76,cy=7+Math.random()*33,col=fireCols[Math.floor(Math.random()*fireCols.length)];
 for(let i=0;i<30;i++){let s=document.createElement('i');s.className='spark';let a=i*Math.PI/15,r=48+Math.random()*80;s.style.left=cx+'%';s.style.top=cy+'%';s.style.background=col;s.style.boxShadow='0 0 8px '+col;s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');fx.appendChild(s);setTimeout(()=>s.remove(),1450)}},b*300)
}

let idx=0;
document.querySelector('#start').onclick=function(){
 this.remove();music.currentTime=0;music.play().catch(()=>{});
 fillField(31);
 for(let i=0;i<C.meteor_rate;i++)setTimeout(()=>meteor(i),i*420);
 fireworks(C.fire_rate);
 setTimeout(show,700);
};

function show(){
 phrase.classList.remove('show');
 setTimeout(()=>{
   phrase.textContent=C.phrases[idx];
   phrase.classList.add('show');
   petalRain(16+idx*2);
   for(let i=0;i<C.meteor_rate;i++)setTimeout(()=>meteor(i+idx),i*430);
   fireworks(C.fire_rate);
   idx++;
   if(idx<C.phrases.length) setTimeout(show,4700);
   else setTimeout(()=>{petalRain(42);fireworks(C.fire_rate+4);for(let i=0;i<6;i++)setTimeout(()=>meteor(i),i*400)},3200);
 },420);
}
</script></body></html>
